<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - AVL Tree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .container-main {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin: 0;
        }

        /* Card Container */
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease;
        }

        .card-header {
            background: var(--primary-color);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
            border: none;
        }

        .card-header h5 {
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 30px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control, .form-select {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        .input-group .form-control {
            border-right: none;
        }

        .input-group .btn {
            border-left: none;
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background-color: #dc2626;
            transform: scale(1.05);
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h6 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Task List */
        .tasks-list {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .tasks-list::-webkit-scrollbar {
            width: 8px;
        }

        .tasks-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .tasks-list::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .tasks-list::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        /* Task Item */
        .task-item {
            background: white;
            border-left: 5px solid;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .task-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transform: translateX(5px);
        }

        /* Priority Colors */
        .task-item.priority-critical {
            border-left-color: #ef4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.05), white);
        }

        .task-item.priority-high {
            border-left-color: #f97316;
            background: linear-gradient(90deg, rgba(249, 115, 22, 0.05), white);
        }

        .task-item.priority-medium {
            border-left-color: #f59e0b;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.05), white);
        }

        .task-item.priority-low {
            border-left-color: #10b981;
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.05), white);
        }

        .task-item.priority-verylow {
            border-left-color: #3b82f6;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.05), white);
        }

        .task-content {
            flex: 1;
        }

        .task-description {
            font-size: 1.05rem;
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .task-meta {
            font-size: 0.85rem;
            color: #999;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .priority-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .priority-badge.critical {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .priority-badge.high {
            background-color: #ffedd5;
            color: #92400e;
        }

        .priority-badge.medium {
            background-color: #fef3c7;
            color: #b45309;
        }

        .priority-badge.low {
            background-color: #d1fae5;
            color: #065f46;
        }

        .priority-badge.verylow {
            background-color: #dbeafe;
            color: #1e3a8a;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin: 0;
        }

        /* Loading */
        .spinner-border {
            color: var(--primary-color);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Alert */
        .alert {
            border: none;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-actions {
                width: 100%;
                margin-top: 10px;
            }

            .btn-delete {
                width: 100%;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .card-body {
                padding: 20px;
            }
        }

        /* Tooltip */
        .tooltip-text {
            position: relative;
        }

        .tooltip-text::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .tooltip-text:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header -->
        <div class="header">
            <h1><i class="bi bi-check2-square"></i> TaskManager AVL</h1>
            <p>Gerenciador de tarefas inteligente com Árvore AVL balanceada</p>
            <a href="/tree-info" class="btn btn-light btn-sm mt-3" style="opacity: 0.9;">
                <i class="bi bi-info-circle"></i> Saiba mais sobre a AVL
            </a>
        </div>

        <!-- Alerts -->
        <div id="alerts-container"></div>

        <!-- Stats -->
        <div class="stats-container" id="stats-container">
            <div class="stat-card">
                <h6>Total de Tarefas</h6>
                <div class="value" id="total-tasks">0</div>
            </div>
            <div class="stat-card">
                <h6>Prioridade Máxima</h6>
                <div class="value" id="max-priority">-</div>
            </div>
            <div class="stat-card">
                <h6>Prioridade Mínima</h6>
                <div class="value" id="min-priority">-</div>
            </div>
            <div class="stat-card">
                <h6>Altura da Árvore</h6>
                <div class="value" id="tree-height">0</div>
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-plus-circle"></i> Adicionar Nova Tarefa</h5>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label" for="task-description">Descrição da Tarefa</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="task-description" 
                        placeholder="Ex: Estudar para prova de Estrutura de Dados"
                        maxlength="200"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="task-priority">Prioridade (1-100)</label>
                    <div class="input-group">
                        <input 
                            type="range" 
                            class="form-range" 
                            id="task-priority" 
                            min="1" 
                            max="100" 
                            value="50"
                            style="height: 40px; padding: 8px;"
                        >
                        <span class="input-group-text" style="width: 70px; border-radius: 0 8px 8px 0;">
                            <span id="priority-value">50</span>
                        </span>
                    </div>
                    <small class="text-muted d-block mt-2">
                        <i class="bi bi-info-circle"></i>
                        1-30: Baixa | 31-60: Média | 61-80: Alta | 81-100: Crítica
                    </small>
                </div>

                <button class="btn btn-primary" id="add-task-btn" type="button">
                    <i class="bi bi-plus-lg"></i> Adicionar Tarefa
                </button>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-list-check"></i> Minhas Tarefas</h5>
            </div>
            <div class="card-body">
                <div class="tasks-list" id="tasks-list">
                    <div class="loading">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API Base URL
        const API_BASE = 'http://localhost:5000/api';

        // DOM Elements
        const taskDescription = document.getElementById('task-description');
        const taskPriority = document.getElementById('task-priority');
        const priorityValue = document.getElementById('priority-value');
        const addTaskBtn = document.getElementById('add-task-btn');
        const tasksList = document.getElementById('tasks-list');
        const alertsContainer = document.getElementById('alerts-container');

        // Update priority display
        taskPriority.addEventListener('input', (e) => {
            priorityValue.textContent = e.target.value;
        });

        // Add task
        addTaskBtn.addEventListener('click', addTask);
        taskDescription.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        async function addTask() {
            const description = taskDescription.value.trim();
            const priority = parseInt(taskPriority.value);

            if (!description) {
                showAlert('Por favor, insira uma descrição para a tarefa', 'danger');
                taskDescription.focus();
                return;
            }

            if (priority < 1 || priority > 100) {
                showAlert('A prioridade deve estar entre 1 e 100', 'danger');
                return;
            }

            addTaskBtn.disabled = true;
            addTaskBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Adicionando...';

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: description,
                        priority: priority
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erro ao adicionar tarefa');
                }

                const task = await response.json();
                showAlert(`Tarefa "${task.description}" adicionada com sucesso!`, 'success');
                taskDescription.value = '';
                taskPriority.value = 50;
                priorityValue.textContent = '50';
                
                loadTasks();
                updateStats();
            } catch (error) {
                showAlert(`Erro: ${error.message}`, 'danger');
                console.error('Error adding task:', error);
            } finally {
                addTaskBtn.disabled = false;
                addTaskBtn.innerHTML = '<i class="bi bi-plus-lg"></i> Adicionar Tarefa';
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                if (!response.ok) throw new Error('Erro ao carregar tarefas');

                const tasks = await response.json();

                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>Nenhuma tarefa registrada. Crie uma para começar!</p>
                        </div>
                    `;
                    return;
                }

                tasksList.innerHTML = tasks.map(task => {
                    const priorityClass = getPriorityClass(task.priority);
                    const priorityLabel = getPriorityLabel(task.priority);
                    const createdDate = new Date(task.created_at * 1000).toLocaleDateString('pt-BR');

                    return `
                        <div class="task-item priority-${priorityClass}">
                            <div class="task-content">
                                <div class="task-description">${escapeHtml(task.description)}</div>
                                <div class="task-meta">
                                    <span class="priority-badge ${priorityClass}">
                                        <i class="bi bi-exclamation-circle"></i> ${task.priority}
                                    </span>
                                    <span class="tooltip-text" data-tooltip="ID da tarefa">
                                        <i class="bi bi-hash"></i> ${task.id}
                                    </span>
                                    <span class="tooltip-text" data-tooltip="Data de criação">
                                        <i class="bi bi-calendar"></i> ${createdDate}
                                    </span>
                                </div>
                            </div>
                            <div class="task-actions">
                                <button class="btn-delete" onclick="deleteTask('${task.id}', '${escapeHtml(task.description)}')">
                                    <i class="bi bi-trash"></i> Deletar
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                tasksList.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> Erro ao carregar tarefas: ${error.message}
                    </div>
                `;
                console.error('Error loading tasks:', error);
            }
        }

        async function deleteTask(taskId, description) {
            if (!confirm(`Tem certeza que deseja deletar a tarefa: "${description}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erro ao deletar tarefa');
                }

                showAlert('Tarefa deletada com sucesso!', 'success');
                loadTasks();
                updateStats();
            } catch (error) {
                showAlert(`Erro: ${error.message}`, 'danger');
                console.error('Error deleting task:', error);
            }
        }

        async function updateStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) throw new Error('Erro ao carregar estatísticas');

                const stats = await response.json();

                document.getElementById('total-tasks').textContent = stats.total;
                document.getElementById('max-priority').textContent = stats.max_priority || '-';
                document.getElementById('min-priority').textContent = stats.min_priority || '-';
                document.getElementById('tree-height').textContent = stats.tree_height || '0';
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        function getPriorityClass(priority) {
            if (priority >= 81) return 'critical';
            if (priority >= 61) return 'high';
            if (priority >= 31) return 'medium';
            if (priority >= 1) return 'low';
            return 'verylow';
        }

        function getPriorityLabel(priority) {
            if (priority >= 81) return 'Crítica';
            if (priority >= 61) return 'Alta';
            if (priority >= 31) return 'Média';
            return 'Baixa';
        }

        function showAlert(message, type = 'info') {
            const alertId = 'alert-' + Date.now();
            const alert = document.createElement('div');
            alert.id = alertId;
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertsContainer.appendChild(alert);

            setTimeout(() => {
                const element = document.getElementById(alertId);
                if (element) {
                    element.remove();
                }
            }, 5000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initial load
        loadTasks();
        updateStats();

        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadTasks();
            updateStats();
        }, 10000);
    </script>
</body>
</html>
